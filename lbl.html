<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Design Workshop</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
        }
        /* Header section */
        
        .hero {
            background-color: #212529;
            color: white;
            padding: 55px 0;
        }
        
        .hero h1 {
            font-size: 40px;
            font-weight: bold;
        }
        
        .hero p {
            color: #adb5bd;
            font-size: 18px;
        }
        
        .workshop-badge {
            background-color: #ffc107;
            color: black;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        /* Main cards */
        
        .content-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            height: 100%;
        }
        
        .content-card h4 {
            font-weight: bold;
            margin-bottom: 25px;
        }
        
        .detail {
            margin-bottom: 20px;
        }
        
        .detail strong {
            display: block;
            margin-bottom: 5px;
        }
        
        .register-btn {
            background-color: #5145e5;
            color: white;
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 6px;
        }
        
        .register-btn:hover {
            background-color: #392fc0;
            color: white;
        }
        /* Responsive heading */
        
        @media (max-width: 576px) {
            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container">

            <span class="workshop-badge">Free Workshop</span>

            <h1 class="mt-3">Web Design Workshop</h1>

            <p>
                Build your first responsive webpage with HTML and Bootstrap.
            </p>

        </div>
    </header>


    <!-- Main Content -->
    <main class="container my-5">

        <div class="row g-4">

            <!-- Left Column: Workshop Details -->
            <div class="col-12 col-md-6">

                <div class="content-card">

                    <h4>Workshop details</h4>

                    <div class="detail">
                        <strong>Date</strong> Saturday
                    </div>

                    <div class="detail">
                        <strong>Location</strong> School computer lab
                    </div>

                    <div class="detail">
                        <strong>What to bring</strong> A laptop and charger
                    </div>

                </div>

            </div>


            <!-- Right Column: Registration Form -->
            <div class="col-12 col-md-6">

                <div class="content-card">

                    <h4>Register for a session</h4>

                    <form>

                        <!-- Full Name -->
                        <div class="mb-4">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text" class="form-control" placeholder="Enter your full name" required>
                        </div>


                        <!-- Email -->
                        <div class="mb-4">
                            <label class="form-label">
                                Email address
                            </label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>


                        <!-- Session Selection -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Choose a session
                            </label>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="session" id="morning" value="morning" required>

                                <label class="form-check-label" for="morning">
                                    Morning: 9:00–12:00 AM
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="session" id="afternoon" value="afternoon">

                                <label class="form-check-label" for="afternoon">
                                    Afternoon: 2:00–4:00 PM
                                </label>
                            </div>

                        </div>


                        <!-- Register Button -->
                        <button type="submit" class="btn register-btn">
                            Register
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
